<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Usuario</title>
    <!-- Usando Thymeleaf para asegurar la carga del CSS -->
    <link rel="stylesheet" th:href="@{/css/CRUD/styles.css}">
    <!-- Fallback por si Thymeleaf no funciona -->
    <link rel="stylesheet" href="/css/CRUD/styles.css">
</head>
<body>
<div id="eliminar-usuario">
    <h1>Eliminar Usuario</h1>

    <form th:action="@{/usuario/eliminar_usuario}" method="post">
        <label for="idUsuario">ID del Usuario a eliminar:</label>
        <input type="number" id="idUsuario" name="id" placeholder="Ingrese ID" required>
        <br><br>
        <button type="submit" class="boton">Eliminar Usuario</button>
    </form>


    <br>
    <a th:href="@{/usuario/all_usuario}" class="boton">Volver a la lista de usuarios</a>
</div>
</body>
</html>
