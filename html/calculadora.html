<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/calculadora.css">
</head>
<body>
    <form id="calculator">
        <label for="display"></label>
        <input type="text" id="display" disabled placeholder="0" title="Campo de resultado">
        
        <div>
            <button type="button" class="num">1</button>
            <button type="button" class="num">2</button>
            <button type="button" class="num">3</button>
            <button type="button" class="ope">+</button>
        </div>
        <div>
            <button type="button" class="num">4</button>
            <button type="button" class="num">5</button>
            <button type="button" class="num">6</button>
            <button type="button" class="ope">-</button>
        </div>
        <div>
            <button type="button" class="num">7</button>
            <button type="button" class="num">8</button>
            <button type="button" class="num">9</button>
            <button type="button" class="ope">*</button>
        </div>
        <div>
            <button type="button" id="limpiar">C</button>
            <button type="button" class="num">0</button>
            <button type="button" id="resultado">=</button>
            <button type="button" class="ope">/</button>
        </div>
        <div>
            <button type="button" class="num">.</button>
        </div>
    </form>

    <script>
        const display = document.getElementById("display");
        
        function appendToDisplay(value) {
            if (value === '.' && display.value.includes('.')) {
                return;
            }
            
            const lastChar = display.value.slice(-1);
            const isOperator = ['+', '-', '*', '/'].includes(value);
            const lastIsOperator = ['+', '-', '*', '/'].includes(lastChar);
            
            if (isOperator && lastIsOperator) {
                display.value = display.value.slice(0, -1) + value;
            } else if (display.value === "Error" || display.value === "0") {
                display.value = isOperator ? "0" + value : value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculateResult() {
            try {
                let expression = display.value.replace(/\s/g, '');
                
                if (!expression) {
                    display.value = "0";
                    return;
                }
                
                const lastChar = expression.slice(-1);
                if (['+', '-', '*', '/'].includes(lastChar)) {
                    expression = expression.slice(0, -1);
                }
                
                if (/\/\s*0(?!\d)/.test(expression)) {
                    throw new Error("División por cero");
                }
                
                const result = new Function('return ' + expression)();
                
                if (isNaN(result) || !isFinite(result)) {
                    throw new Error("Resultado inválido");
                }
                
    
                display.value = Number(result.toFixed(10)).toString();
                
            } catch (error) {
                display.value = "Error";
            }
        }

        document.querySelectorAll("button").forEach(boton => {
            boton.addEventListener("click", (event) => {
                event.preventDefault();
                
                if (boton.classList.contains("num") || boton.classList.contains("ope")) {
                    appendToDisplay(boton.textContent);
                } else if (boton.id === "limpiar") {
                    clearDisplay();
                } else if (boton.id === "resultado") {
                    calculateResult();
                }
            });
        });

        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (/[0-9.]/.test(key)) {
                appendToDisplay(key);
            } else if (['+', '-', '*', '/'].includes(key)) {
                appendToDisplay(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculateResult();
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                clearDisplay();
            } else if (key === 'Backspace') {
                display.value = display.value.slice(0, -1);
            }
        });
    </script>
</body>
</html>
