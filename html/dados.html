<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dados</title>
    <link rel="stylesheet" href="css/dados.css">
</head>

<body>
    <button type="button" id="lanzardados"> Lanzar dados </button>
    <div class="grid-card">
        <div class="dado">0</div>
        <div class="dado">0</div>
        <div class="dado">0</div>
        <div class="dado">0</div>
        <div class="dado">0</div>
        <div class="imagen"></div>
        <div class="imagen"></div>
        <div class="imagen"></div>
        <div class="imagen"></div>
        <div class="imagen"></div>
    </div>
</body>
<script>
    document.querySelector("#lanzardados").addEventListener("click", function() {
        const caras = [1, 2, 3, 4, 5, 6];
        const imagenes = document.querySelectorAll(".imagen");
        const dados = document.querySelectorAll(".dado");
        for (let i = 0; i < dados.length; i++) {
            const randomIndex = Math.floor(Math.random() * caras.length);
            const numeroCara = caras[randomIndex];

            dados[i].textContent = numeroCara;
            imagenes[i].style.backgroundImage = "url('img/caras_dados/" + numeroCara + ".png')";
            imagenes[i].style.backgroundSize = "cover";
            imagenes[i].style.backgroundPosition = "center";
            imagenes[i].style.backgroundRepeat = "no-repeat";
        }



    });
</script>
</html>
